<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>既読スルー・プロット (オンライン対戦版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap');
    body {
      font-family: 'M PLUS Rounded 1c', -apple-system, sans-serif;
      user-select: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    
    /* フリップカード用CSS */
    .perspective-1000 { perspective: 1000px; }
    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-style: preserve-3d;
    }
    .flip-card-inner.flipped {
      transform: rotateY(180deg);
    }
    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 0.75rem;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center p-2 sm:p-4">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col min-h-[92vh] border border-slate-200 relative">
    
    <!-- ヘッダー -->
    <header class="bg-indigo-600 text-white px-4 py-3 flex justify-between items-center shadow-md relative z-10">
      <div class="flex items-center space-x-2">
        <i class="fa-solid font-bold text-xl fa-comments"></i>
        <h1 class="font-extrabold text-lg tracking-wide flex items-center">
          既読スルー <span class="ml-2 text-[10px] bg-rose-500 px-2 py-0.5 rounded-full uppercase tracking-wider font-black">Online</span>
        </h1>
      </div>
      <div id="header-round-info" class="hidden bg-indigo-800/60 px-3 py-1 rounded-full text-xs font-bold border border-indigo-400/30">
        ROUND <span id="round-num" class="text-amber-300 text-sm">1</span> / 4
      </div>
    </header>

    <!-- 1. ロビー画面 -->
    <div id="screen-lobby" class="flex-1 flex flex-col justify-center p-6 space-y-8 bg-slate-50">
      <div class="text-center">
        <i class="fa-solid fa-earth-americas text-4xl text-indigo-300 mb-2"></i>
        <h2 class="text-2xl font-black text-indigo-700">オンライン対戦</h2>
        <p class="text-xs text-slate-500 mt-1 font-bold">友達とルームIDを共有して遊ぼう！</p>
      </div>

      <div class="space-y-2">
        <label class="text-xs font-bold text-slate-500 ml-1">あなたの名前</label>
        <input type="text" id="player-name" placeholder="ゲストプレイヤー" value="プレイヤー" class="w-full p-4 border-2 border-indigo-100 rounded-2xl font-extrabold text-slate-700 focus:border-indigo-400 focus:outline-none transition shadow-sm text-center">
      </div>
      
      <div class="space-y-3 pt-2">
        <button id="btn-create-room" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black shadow-lg shadow-indigo-600/30 hover:bg-indigo-700 active:scale-95 transition-all text-lg disabled:opacity-50">部屋を作る</button>
      </div>
      
      <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-slate-200"></div>
        <span class="flex-shrink-0 mx-4 text-slate-400 text-xs font-bold">または</span>
        <div class="flex-grow border-t border-slate-200"></div>
      </div>
      
      <div class="space-y-3">
        <input type="text" id="room-id-input" placeholder="ルームID (5桁)" maxlength="5" class="w-full p-4 border-2 border-slate-200 rounded-2xl font-black tracking-widest text-2xl text-center text-slate-700 focus:border-emerald-400 focus:outline-none transition shadow-sm">
        <button id="btn-join-room" class="w-full py-4 bg-emerald-500 text-white rounded-2xl font-black shadow-lg shadow-emerald-500/30 hover:bg-emerald-600 active:scale-95 transition-all text-lg disabled:opacity-50">部屋に参加する</button>
      </div>
    </div>

    <!-- 2. 待機室画面 -->
    <div id="screen-waiting" class="flex-1 flex flex-col p-6 hidden bg-slate-50">
      <div class="text-center mb-6">
        <h2 class="text-lg font-extrabold text-indigo-700 mb-1">待機室</h2>
        <div class="bg-white border-2 border-slate-200 rounded-2xl p-4 shadow-sm inline-block min-w-[200px]">
          <p class="text-xs text-slate-400 font-bold mb-1">ルームIDを共有しよう</p>
          <div id="display-room-id" class="font-black text-4xl tracking-widest text-slate-800">-----</div>
        </div>
      </div>
      
      <div class="flex-1">
        <h3 class="text-xs font-bold text-slate-500 mb-2 ml-1"><i class="fa-solid fa-users mr-1"></i> 参加プレイヤー (<span id="waiting-count">1</span>/4)</h3>
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden" id="waiting-players-list">
          <!-- 参加者リストがここに表示 -->
        </div>
      </div>
      
      <div class="mt-6 space-y-3" id="host-controls">
        <button id="btn-add-cpu" class="w-full py-3.5 bg-amber-500 text-white rounded-2xl font-bold shadow-md hover:bg-amber-600 active:scale-95 transition flex justify-center items-center">
          <i class="fa-solid fa-robot mr-2"></i> 足りない枠をCPUで埋める
        </button>
        <button id="btn-start-game" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black shadow-lg shadow-indigo-600/30 hover:bg-indigo-700 active:scale-95 transition text-lg disabled:opacity-50">ゲームを開始する</button>
      </div>
      
      <div id="guest-waiting-msg" class="hidden mt-6 bg-slate-100 rounded-xl p-4 text-center border border-slate-200">
        <div class="animate-spin inline-block w-6 h-6 border-[3px] border-indigo-200 border-t-indigo-600 rounded-full mb-2"></div>
        <p class="text-sm font-bold text-slate-500">ホストがゲームを開始するのを<br>待っています...</p>
      </div>
    </div>

    <!-- 3. ゲーム画面 -->
    <main id="screen-game" class="flex-1 p-3 flex flex-col justify-between space-y-3 hidden bg-slate-100">
      <!-- 得点・ターゲットボード -->
      <div class="bg-slate-900 rounded-2xl p-4 text-white shadow-inner relative overflow-hidden">
        <div class="flex justify-between items-end mb-2">
          <div>
            <span class="text-xs text-slate-400 font-bold block mb-0.5">現在の場の合計</span>
            <div class="flex items-baseline space-x-1">
              <span id="field-score" class="text-4xl font-extrabold text-cyan-400 tracking-tight">0</span>
              <span class="text-slate-400 text-sm font-bold">/ <span id="target-score">10</span> pt</span>
            </div>
          </div>
          <div class="text-right">
            <span class="text-xs text-amber-400 font-bold block mb-1">達成時報酬</span>
            <span class="bg-amber-500/20 text-amber-300 border border-amber-500/40 text-xs px-2.5 py-1 rounded-full font-extrabold">
              +<span id="reward-pt">1</span> pt
            </span>
          </div>
        </div>
        <!-- ゲージ -->
        <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden border border-slate-700">
          <div id="score-bar" class="bg-gradient-to-r from-cyan-500 to-indigo-500 h-full w-0 transition-all duration-300"></div>
        </div>
        <div id="kidoku-status" class="mt-2 text-center hidden">
          <span class="bg-rose-500/20 text-rose-300 text-[11px] px-2 py-0.5 rounded-md border border-rose-500/30 font-bold animate-pulse">
            🔥 既読スルー発動中！ (目標: 20pt / 報酬: 2pt)
          </span>
        </div>
      </div>

      <!-- プレイヤー状態 ＆ 提出カード領域 -->
      <div>
        <div class="flex justify-between items-center text-xs font-bold text-slate-500 mb-1.5 px-1">
          <span><i class="fa-solid fa-users mr-1"></i>プレイヤーと場</span>
          <span id="phase-badge" class="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-bold">待機中</span>
        </div>
        <div class="grid grid-cols-4 gap-2" id="players-grid">
          <!-- JSで動的に初期化・更新されます -->
        </div>
      </div>

      <!-- リアルタイム対戦ログ -->
      <div class="flex-1 min-h-[90px] max-h-[120px] bg-slate-900 text-slate-200 rounded-xl p-2.5 text-xs font-mono custom-scrollbar overflow-y-auto space-y-1 shadow-inner border border-slate-800" id="log-box"></div>

      <!-- あなたの手札領域 -->
      <div class="bg-slate-50 rounded-2xl p-3 border border-slate-200">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-bold text-slate-600">
            <i class="fa-solid fa-hand-pointer mr-1"></i>あなたの手札
          </span>
          <span class="text-[11px] text-slate-400">提出カードを1枚タップ</span>
        </div>
        <!-- 未読スルーパスボタン -->
        <div id="pass-option-container" class="mb-2 hidden">
          <button id="btn-pass-action" class="w-full py-2 bg-emerald-500 hover:bg-emerald-600 active:scale-[0.98] text-white font-bold text-xs rounded-xl shadow transition flex items-center justify-center space-x-1 border-2 border-emerald-400">
            <i class="fa-solid fa-forward-step"></i>
            <span>未読スルーパスを実行する (+0)</span>
          </button>
        </div>
        <!-- 手札リスト -->
        <div class="flex flex-wrap gap-1.5 justify-center max-h-[140px] overflow-y-auto custom-scrollbar p-1" id="hand-container"></div>
      </div>
    </main>

    <!-- アクションエリア (ゲーム画面時のみ表示) -->
    <footer id="footer-action" class="p-3 bg-white border-t border-slate-100 hidden relative z-10">
      <button id="submit-btn" disabled class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-extrabold text-sm rounded-2xl shadow-lg disabled:shadow-none transition-all duration-200 flex items-center justify-center space-x-2">
        <span>カードを提出する</span>
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </footer>

  </div>

  <!-- ゲーム結果・ラウンドモーダル -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl border border-slate-100 transform transition-all scale-95">
      <div class="text-4xl mb-2">🏆</div>
      <h2 id="modal-title" class="text-xl font-extrabold text-slate-800 mb-1">ラウンド終了</h2>
      <p id="modal-desc" class="text-xs text-slate-500 mb-4">結果の詳細がここに表示されます</p>

      <div class="bg-slate-50 rounded-2xl p-3 mb-4 space-y-2 text-left text-xs font-bold border border-slate-100" id="modal-scores"></div>

      <!-- ホスト用ボタン -->
      <button id="modal-next-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold rounded-2xl shadow-md transition hidden">
        次のラウンドへ
      </button>
      <!-- ゲスト用メッセージ -->
      <div id="modal-waiting-msg" class="w-full py-3 bg-slate-100 text-slate-500 font-bold rounded-2xl hidden">
        <i class="fa-solid fa-spinner fa-spin mr-1"></i> ホストを待機中...
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- Firebase Initialization ---
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

    // --- Global State ---
    let currentUser = null;
    let currentRoomId = null;
    let unsubscribeSnapshot = null;
    let gameState = null;
    let isUIInitialized = false;
    let selectedHandIndex = null; // ローカルの選択状態
    let isHostProcessingReveal = false; // 二重実行防止

    const CARDS = { NUM: ['+1', '+2', '+3'], SPECIAL: ['通知オフ', '未読スルー', '既読スルー', '送信取消', 'ブロック'] };
    const CARD_COLORS = {
      '+1': 'bg-blue-50 text-blue-600 border-blue-300', '+2': 'bg-sky-50 text-sky-600 border-sky-300', '+3': 'bg-indigo-50 text-indigo-600 border-indigo-300',
      '通知オフ': 'bg-amber-50 text-amber-700 border-amber-300', '未読スルー': 'bg-emerald-50 text-emerald-700 border-emerald-300',
      '既読スルー': 'bg-rose-50 text-rose-700 border-rose-300', '送信取消': 'bg-purple-50 text-purple-700 border-purple-300', 'ブロック': 'bg-slate-100 text-slate-700 border-slate-300'
    };

    // --- Auth Setup ---
    async function initAuth() {
      if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
        await signInWithCustomToken(auth, __initial_auth_token);
      } else {
        await signInAnonymously(auth);
      }
    }
    
    onAuthStateChanged(auth, user => {
      currentUser = user;
      if (user) {
        document.getElementById('btn-create-room').disabled = false;
        document.getElementById('btn-join-room').disabled = false;
      }
    });
    
    // アプリ起動
    initAuth();

    function getRoomRef(roomId) {
      return doc(db, 'artifacts', appId, 'public', 'data', 'kidoku_rooms', roomId);
    }

    function switchScreen(screenId) {
      ['screen-lobby', 'screen-waiting', 'screen-game'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(screenId).classList.remove('hidden');
      
      if (screenId === 'screen-game') {
        document.getElementById('header-round-info').classList.remove('hidden');
        document.getElementById('footer-action').classList.remove('hidden');
      } else {
        document.getElementById('header-round-info').classList.add('hidden');
        document.getElementById('footer-action').classList.add('hidden');
      }
    }

    // --- Lobby Functions ---
    document.getElementById('btn-create-room').addEventListener('click', async () => {
      if (!currentUser) return;
      const playerName = document.getElementById('player-name').value || 'ホスト';
      const roomId = Math.floor(10000 + Math.random() * 90000).toString();
      
      const initialGameState = {
        roomId, hostId: currentUser.uid, status: 'WAITING', round: 1, oyaIndex: 0,
        fieldScore: 0, targetScore: 10, rewardPt: 1, kidokuActivated: false,
        skipNextPlayer: false, disableNextPlayer: false, lastNumericValue: 0, phase: 'PLOT',
        playerSeatOrder: [0, 1, 2, 3], logs: [],
        players: [{ id: 0, uid: currentUser.uid, name: playerName, score: 0, hand: [], passRights: false, plottedCard: null, plottedCardTemp: null, isCpu: false }]
      };

      await setDoc(getRoomRef(roomId), initialGameState);
      currentRoomId = roomId;
      listenRoom(roomId);
    });

    document.getElementById('btn-join-room').addEventListener('click', async () => {
      if (!currentUser) return;
      const playerName = document.getElementById('player-name').value || 'ゲスト';
      const roomId = document.getElementById('room-id-input').value.trim();
      if (roomId.length !== 5) { alert('5桁のルームIDを入力してください'); return; }
      
      const docSnap = await getDoc(getRoomRef(roomId));
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (data.status !== 'WAITING') { alert('すでにゲームが開始されています'); return; }
        if (data.players.length >= 4) { alert('満室です'); return; }
        
        // 既存プレイヤーかチェック (リロード対策)
        let playerExists = data.players.some(p => p.uid === currentUser.uid);
        if (!playerExists) {
            data.players.push({ id: data.players.length, uid: currentUser.uid, name: playerName, score: 0, hand: [], passRights: false, plottedCard: null, plottedCardTemp: null, isCpu: false });
            await updateDoc(getRoomRef(roomId), { players: data.players });
        }
        currentRoomId = roomId;
        listenRoom(roomId);
      } else {
        alert('部屋が見つかりません');
      }
    });

    // --- Realtime Sync ---
    function listenRoom(roomId) {
      if (unsubscribeSnapshot) unsubscribeSnapshot();
      unsubscribeSnapshot = onSnapshot(getRoomRef(roomId), (docSnap) => {
        if (!docSnap.exists()) return;
        gameState = docSnap.data();
        
        if (gameState.status === 'FINISHED') {
           alert('ホストがゲームを終了しました。');
           location.reload();
           return;
        }

        if (gameState.status === 'WAITING') updateWaitingRoomUI();
        else if (gameState.status === 'PLAYING') updateGameUI();

        // ホストの自動進行ロジック (PLOT完了を検知)
        if (gameState.status === 'PLAYING' && gameState.hostId === currentUser.uid) {
           if (gameState.phase === 'PLOT') {
              const allPlotted = gameState.players.length === 4 && gameState.players.every(p => p.plottedCard === 'FACE_DOWN');
              if (allPlotted && !isHostProcessingReveal) {
                 isHostProcessingReveal = true;
                 setTimeout(async () => {
                    gameState.phase = 'REVEAL_0';
                    gameState.logs.push('🃏 全員のカードが出揃いました。親から順にオープンします！');
                    await updateDoc(getRoomRef(currentRoomId), gameState);
                    setTimeout(() => processRevealStep(0), 500); // フリップ実行までの間隔
                 }, 800);
              }
           } else {
              isHostProcessingReveal = false;
           }
        }
      }, (err) => console.error(err));
    }

    // --- Waiting Room ---
    function updateWaitingRoomUI() {
      switchScreen('screen-waiting');
      document.getElementById('display-room-id').innerText = gameState.roomId;
      document.getElementById('waiting-count').innerText = gameState.players.length;
      
      const list = document.getElementById('waiting-players-list');
      list.innerHTML = '';
      gameState.players.forEach((p, idx) => {
        const isHost = idx === 0;
        const icon = p.isCpu ? '🤖' : (isHost ? '👑' : '👤');
        list.innerHTML += `<div class="p-3 border-b border-slate-100 last:border-0 font-bold text-slate-700 flex items-center"><span class="w-8 text-center">${icon}</span> ${p.name}</div>`;
      });
      
      if (gameState.hostId === currentUser.uid) {
        document.getElementById('host-controls').classList.remove('hidden');
        document.getElementById('guest-waiting-msg').classList.add('hidden');
        document.getElementById('btn-add-cpu').disabled = gameState.players.length >= 4;
        document.getElementById('btn-start-game').disabled = gameState.players.length !== 4;
      } else {
        document.getElementById('host-controls').classList.add('hidden');
        document.getElementById('guest-waiting-msg').classList.remove('hidden');
      }
    }

    document.getElementById('btn-add-cpu').addEventListener('click', async () => {
      if (gameState.hostId !== currentUser.uid || gameState.players.length >= 4) return;
      const cpuCount = gameState.players.filter(p => p.isCpu).length + 1;
      gameState.players.push({
        id: gameState.players.length, uid: `cpu_${Math.random().toString(36).substring(7)}`, name: `CPU ${cpuCount}`,
        score: 0, hand: [], passRights: false, plottedCard: null, plottedCardTemp: null, isCpu: true
      });
      await updateDoc(getRoomRef(currentRoomId), { players: gameState.players });
    });

    document.getElementById('btn-start-game').addEventListener('click', async () => {
      if (gameState.hostId !== currentUser.uid || gameState.players.length !== 4) return;
      
      const initialOya = Math.floor(Math.random() * 4);
      gameState.oyaIndex = initialOya;
      gameState.status = 'PLAYING';
      setupRoundState();
      await updateDoc(getRoomRef(currentRoomId), gameState);
    });

    function setupRoundState() {
      gameState.fieldScore = 0; gameState.targetScore = 10; gameState.rewardPt = 1;
      gameState.kidokuActivated = false; gameState.skipNextPlayer = false; gameState.disableNextPlayer = false;
      gameState.lastNumericValue = 0; gameState.phase = 'PLOT';
      
      gameState.players.forEach((p, idx) => {
        p.hand = ['+1','+1','+2','+2','+3','+3', '通知オフ','未読スルー','既読スルー','送信取消','ブロック'];
        p.passRights = false;
        p.plottedCard = null;
        
        // CPUはあらかじめカードを決定しておく
        if (p.isCpu) {
           p.plottedCardTemp = chooseCpuCard(p, idx);
           p.plottedCard = 'FACE_DOWN';
        } else {
           p.plottedCardTemp = null;
        }
      });
      gameState.logs.push(`--- 🔔 第 ${gameState.round} ラウンド開始 (親: ${gameState.players[gameState.oyaIndex].name}) ---`);
      selectedHandIndex = null;
    }

    // --- CPU Logic ---
    function chooseCpuCard(cpu, cpuIdx) {
      if (cpu.passRights && Math.random() < 0.35) {
          cpu.passRights = false; return 'PASS';
      }
      const step = (cpuIdx - gameState.oyaIndex + 4) % 4;
      const neededScore = gameState.targetScore - gameState.fieldScore;

      if (neededScore >= 1 && neededScore <= 3) {
        const targetStr = `+${neededScore}`;
        const winIdx = cpu.hand.findIndex(c => c === targetStr);
        if (winIdx !== -1) return cpu.hand.splice(winIdx, 1)[0];
      }

      const validIndices = [];
      cpu.hand.forEach((card, idx) => {
        let isUseless = false;
        if (card === '既読スルー' && cpuIdx !== gameState.oyaIndex) isUseless = true;
        if (card === '送信取消' && step === 0) isUseless = true;
        if ((card === '通知オフ' || card === 'ブロック') && step === 3) isUseless = true;
        if (!isUseless) validIndices.push(idx);
      });

      const pool = validIndices.length > 0 ? validIndices : cpu.hand.map((_, i) => i);
      const safeIndices = pool.filter(idx => {
        const card = cpu.hand[idx];
        if (['+1', '+2', '+3'].includes(card)) return (gameState.fieldScore + parseInt(card)) <= gameState.targetScore;
        return true;
      });

      const finalPool = safeIndices.length > 0 ? safeIndices : pool;
      const chosenIdx = finalPool[Math.floor(Math.random() * finalPool.length)];
      return cpu.hand.splice(chosenIdx, 1)[0];
    }

    // --- Game UI Setup & Update ---
    function initGameDOM() {
      const pGrid = document.getElementById('players-grid');
      pGrid.innerHTML = '';
      
      let myPlayerId = gameState.players.find(p => p.uid === currentUser.uid)?.id || 0;
      for (let i=0; i<4; i++) {
        const pIdx = (myPlayerId + i) % 4; // 自分を起点に時計回り
        
        const container = document.createElement('div');
        container.className = "flex flex-col space-y-1.5";
        container.innerHTML = `
          <div id="player-card-${pIdx}" class="p-2 rounded-xl text-center border transition-all bg-white border-slate-200">
            <div class="text-xs font-extrabold truncate flex items-center justify-center space-x-1">
              <span id="player-name-${pIdx}" class="truncate"></span>
              <span id="player-oya-${pIdx}" class="text-amber-500 font-bold text-[10px] hidden" title="親">👑</span>
            </div>
            <div class="text-sm font-black text-indigo-600 mt-0.5"><span id="player-score-${pIdx}">0</span> <span class="text-[10px] text-slate-400">pt</span></div>
          </div>
          <div class="w-full aspect-[2/3] max-w-[64px] mx-auto perspective-1000 mt-1 relative">
             <div id="card-inner-${pIdx}" class="flip-card-inner">
                 <div class="flip-card-front shadow-sm border-2 border-indigo-200 bg-indigo-50 text-indigo-400">
                     <i class="fa-solid fa-lock text-sm"></i>
                 </div>
                 <div id="card-back-${pIdx}" class="flip-card-back shadow-md border-2 bg-white text-slate-700"></div>
             </div>
             <div id="card-empty-${pIdx}" class="w-full h-full bg-slate-50 border-2 border-slate-200 border-dashed rounded-xl flex flex-col items-center justify-center absolute top-0 left-0">
                <span class="text-[10px] text-slate-300 italic font-bold">待機...</span>
             </div>
          </div>
        `;
        pGrid.appendChild(container);
      }
      isUIInitialized = true;
    }

    function updateGameUI() {
      if (document.getElementById('screen-game').classList.contains('hidden')) switchScreen('screen-game');
      if (!isUIInitialized) initGameDOM();

      document.getElementById('round-num').innerText = gameState.round;
      document.getElementById('field-score').innerText = gameState.fieldScore;
      document.getElementById('target-score').innerText = gameState.targetScore;
      document.getElementById('reward-pt').innerText = gameState.rewardPt;
      
      const pct = Math.min(100, Math.round((gameState.fieldScore / gameState.targetScore) * 100));
      document.getElementById('score-bar').style.width = `${pct}%`;
      
      if (gameState.kidokuActivated) document.getElementById('kidoku-status').classList.remove('hidden');
      else document.getElementById('kidoku-status').classList.add('hidden');

      // フェーズバッジ
      const pBadge = document.getElementById('phase-badge');
      if (gameState.phase === 'PLOT') { pBadge.innerText = 'カード選択中'; pBadge.className = 'text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-bold'; }
      else { pBadge.innerText = 'オープン＆集計中'; pBadge.className = 'text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded font-bold animate-pulse'; }

      // プレイヤー情報とカードアニメーション
      gameState.players.forEach(p => {
        const pIdx = p.id;
        document.getElementById(`player-name-${pIdx}`).innerText = p.name;
        document.getElementById(`player-score-${pIdx}`).innerText = p.score;
        
        const oyaIcon = document.getElementById(`player-oya-${pIdx}`);
        if (gameState.oyaIndex === pIdx) oyaIcon.classList.remove('hidden'); else oyaIcon.classList.add('hidden');
        
        const pCard = document.getElementById(`player-card-${pIdx}`);
        if (gameState.oyaIndex === pIdx) pCard.className = 'p-2 rounded-xl text-center border transition-all bg-amber-50/90 border-amber-300 ring-2 ring-amber-400/30';
        else pCard.className = 'p-2 rounded-xl text-center border transition-all bg-white border-slate-200';
        
        const cardInner = document.getElementById(`card-inner-${pIdx}`);
        const cardBack = document.getElementById(`card-back-${pIdx}`);
        const cardEmpty = document.getElementById(`card-empty-${pIdx}`);
        
        if (p.plottedCard === null) {
          cardInner.style.display = 'none'; cardInner.classList.remove('flipped'); cardEmpty.style.display = 'flex';
        } else if (p.plottedCard === 'FACE_DOWN') {
          cardEmpty.style.display = 'none'; cardInner.style.display = 'block'; cardInner.classList.remove('flipped');
        } else {
          cardEmpty.style.display = 'none'; cardInner.style.display = 'block';
          const style = CARD_COLORS[p.plottedCard] || 'bg-white text-slate-700 border-slate-300';
          cardBack.className = `flip-card-back shadow-md border-2 ${style}`;
          
          let fontSize = p.plottedCard.length > 2 ? 'text-[11px] leading-tight px-1 text-center' : 'text-xl';
          let htmlStr = `<span class="${fontSize} font-extrabold">${p.plottedCard}</span>`;
          if (p.plottedCard === '未読スルー') htmlStr = `<span class="${fontSize} font-black">未読<br>ｽﾙー</span>`;
          else if (p.plottedCard === '既読スルー') htmlStr = `<span class="${fontSize} font-black">既読<br>ｽﾙー</span>`;
          else if (p.plottedCard === '通知オフ') htmlStr = `<span class="${fontSize} font-black">通知<br>オフ</span>`;
          else if (p.plottedCard === '送信取消') htmlStr = `<span class="${fontSize} font-black">送信<br>取消</span>`;
          else if (p.plottedCard === 'ブロック') htmlStr = `<span class="${fontSize} font-black">ﾌﾞﾛｯｸ</span>`;
          
          cardBack.innerHTML = htmlStr;
          cardInner.classList.add('flipped');
        }
      });

      // 自分の手札更新
      const myPlayer = gameState.players.find(p => p.uid === currentUser.uid);
      if (myPlayer) {
        const handBox = document.getElementById('hand-container');
        handBox.innerHTML = '';
        myPlayer.hand.forEach((card, idx) => {
           const btn = document.createElement('button');
           const style = CARD_COLORS[card] || 'bg-white text-slate-700 border-slate-200';
           const isSelected = selectedHandIndex === idx;
           btn.className = `px-2.5 py-2 rounded-xl text-xs font-extrabold border transition-all duration-150 ${style} ${isSelected ? 'ring-4 ring-indigo-500/40 border-indigo-500 scale-105 shadow-md' : 'shadow-sm'} ${gameState.phase !== 'PLOT' || myPlayer.plottedCard !== null ? 'opacity-50 cursor-not-allowed' : 'active:scale-95'}`;
           btn.innerText = card;
           btn.disabled = gameState.phase !== 'PLOT' || myPlayer.plottedCard !== null;
           btn.addEventListener('click', () => { selectedHandIndex = idx; updateGameUI(); });
           handBox.appendChild(btn);
        });
        
        const passBox = document.getElementById('pass-option-container');
        if (myPlayer.passRights && gameState.phase === 'PLOT' && myPlayer.plottedCard === null) passBox.classList.remove('hidden');
        else passBox.classList.add('hidden');
        
        const submitBtn = document.getElementById('submit-btn');
        if (gameState.phase === 'PLOT' && selectedHandIndex !== null && myPlayer.plottedCard === null) {
          submitBtn.disabled = false; submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        } else {
          submitBtn.disabled = true; submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
        }
      }

      // ログ更新
      const logBox = document.getElementById('log-box');
      logBox.innerHTML = '';
      gameState.logs.forEach(msg => {
        const item = document.createElement('div');
        item.className = "leading-relaxed border-b border-slate-800/50 pb-1";
        item.innerHTML = msg;
        logBox.appendChild(item);
      });
      logBox.scrollTop = logBox.scrollHeight;
      
      // ラウンド終了モーダル
      if (gameState.phase === 'ROUND_END') showModalUI();
      else document.getElementById('modal-backdrop').classList.add('hidden');
    }

    // --- Action Handlers ---
    document.getElementById('btn-pass-action').addEventListener('click', () => {
       if (gameState.phase !== 'PLOT') return;
       selectedHandIndex = 'PASS';
       updateGameUI();
    });

    document.getElementById('submit-btn').addEventListener('click', async () => {
      if (gameState.phase !== 'PLOT' || selectedHandIndex === null) return;
      
      const myIdx = gameState.players.findIndex(p => p.uid === currentUser.uid);
      const me = gameState.players[myIdx];
      if (me.plottedCard !== null) return; // 提出済み
      
      if (selectedHandIndex === 'PASS') {
        me.plottedCardTemp = 'PASS'; me.passRights = false;
      } else {
        me.plottedCardTemp = me.hand.splice(selectedHandIndex, 1)[0];
      }
      me.plottedCard = 'FACE_DOWN';
      selectedHandIndex = null;
      
      updateGameUI(); // ローカル先行更新
      await updateDoc(getRoomRef(currentRoomId), { players: gameState.players });
    });

    // --- Host Game Logic (Reveal & Evaluate) ---
    async function processRevealStep(step) {
      if (gameState.hostId !== currentUser.uid) return;
      const turnOrder = [];
      for (let i = 0; i < 4; i++) turnOrder.push((gameState.oyaIndex + i) % 4);
      
      const pIdx = turnOrder[step];
      const p = gameState.players[pIdx];
      const actualCard = p.plottedCardTemp;
      
      p.plottedCard = actualCard; // 表にする
      
      let skipDraw = false;
      if (gameState.skipNextPlayer) {
        gameState.logs.push(`🚫 <strong class="text-slate-300">${p.name}</strong> はブロックされているためスキップ！`);
        gameState.skipNextPlayer = false;
      } else if (actualCard === 'PASS') {
        gameState.logs.push(`⏩ <strong class="text-emerald-400">${p.name}</strong> はパス権を行使しました。`);
      } else if (gameState.disableNextPlayer) {
        gameState.logs.push(`🔕 <strong class="text-amber-300">${p.name}</strong> のカード [${actualCard}] は「通知オフ」で無効化！(+0)`);
        gameState.disableNextPlayer = false;
      } else {
        // 効果発動
        if (['+1', '+2', '+3'].includes(actualCard)) {
          const val = parseInt(actualCard); gameState.fieldScore += val; gameState.lastNumericValue = val;
          gameState.logs.push(`➕ <strong>${p.name}</strong> が [${actualCard}] を開いた (合計: <strong class="text-cyan-300">${gameState.fieldScore}</strong>)`);
        } else if (actualCard === '未読スルー') {
          p.passRights = true; gameState.logs.push(`🛋️ <strong>${p.name}</strong> が [未読スルー] を発動！次回パス権を獲得。`);
        } else if (actualCard === '既読スルー') {
          if (pIdx === gameState.oyaIndex) {
            gameState.kidokuActivated = true; gameState.logs.push(`👀 <strong>${p.name}</strong> (親) が [既読スルー] を宣言！10pt以上で延長＆高得点！`);
          } else { gameState.logs.push(`👀 <strong>${p.name}</strong> が [既読スルー] を出したが親ではないため無効 (+0)`); }
        } else if (actualCard === '通知オフ') {
          if (step < 3) gameState.disableNextPlayer = true;
          gameState.logs.push(`🚫 <strong>${p.name}</strong> が [通知オフ] を使用！次の人を無効化。`);
        } else if (actualCard === '送信取消') {
          if (step > 0 && gameState.lastNumericValue > 0) {
            gameState.fieldScore = Math.max(0, gameState.fieldScore - gameState.lastNumericValue);
            gameState.logs.push(`↩️ <strong>${p.name}</strong> が [送信取消] を使用！直前の +${gameState.lastNumericValue} を引き戻した (合計: <strong class="text-cyan-300">${gameState.fieldScore}</strong>)`);
            gameState.lastNumericValue = 0;
          } else { gameState.logs.push(`↩️ <strong>${p.name}</strong> が [送信取消] を使用したが、引き戻し失敗。`); }
        } else if (actualCard === 'ブロック') {
          if (step < 3) gameState.skipNextPlayer = true;
          gameState.logs.push(`🧱 <strong>${p.name}</strong> が [ブロック] を使用！次の人を強制お休み。`);
        }
      }
      
      // カード補充
      if (actualCard !== 'PASS' && !skipDraw) {
        p.hand.push(['+1', '+2', '+3'][Math.floor(Math.random() * 3)]);
      }

      // 決着判定
      let roundFinished = false;
      if (gameState.kidokuActivated && gameState.fieldScore >= 10 && gameState.targetScore === 10) {
        gameState.logs.push(`🔥 【既読スルー成功！】親の <strong class="text-amber-300">${gameState.players[gameState.oyaIndex].name}</strong> に 1pt！ゴール20ptへ！`);
        gameState.players[gameState.oyaIndex].score += 1;
        gameState.targetScore = 20; gameState.rewardPt = 2;
      }

      if (gameState.fieldScore === gameState.targetScore) {
        gameState.logs.push(`🎯 <strong class="text-emerald-400">${p.name}</strong> がピッタリ ${gameState.targetScore}pt 達成！ <strong>+${gameState.rewardPt}pt</strong>`);
        p.score += gameState.rewardPt; roundFinished = true;
      } else if (gameState.fieldScore > gameState.targetScore) {
        const prevStep = (step + 3) % 4;
        const prevPIdx = turnOrder[prevStep];
        const prevP = gameState.players[prevPIdx];
        gameState.logs.push(`💥 <strong class="text-rose-400">${p.name}</strong> がスベった！ (${gameState.fieldScore}pt) 一つ前の <strong class="text-indigo-300">${prevP.name}</strong> に <strong>+${gameState.rewardPt}pt</strong>！`);
        prevP.score += gameState.rewardPt; roundFinished = true;
      }

      await updateDoc(getRoomRef(currentRoomId), gameState); // UI同期

      if (roundFinished) {
         setTimeout(async () => {
             gameState.phase = 'ROUND_END';
             await updateDoc(getRoomRef(currentRoomId), gameState);
         }, 1500);
         return;
      }

      // 次のプレイヤーへ
      if (step < 3) {
        setTimeout(async () => {
          gameState.phase = `REVEAL_${step + 1}`;
          await updateDoc(getRoomRef(currentRoomId), { phase: gameState.phase });
          setTimeout(() => processRevealStep(step + 1), 150); // アニメーション間のラグ
        }, 500); // フリップと効果を見る時間
      } else {
        setTimeout(async () => {
          if (gameState.kidokuActivated && gameState.fieldScore < gameState.targetScore) {
            gameState.logs.push(`❌ 既読スルー失敗！親の <strong class="text-amber-300">${gameState.players[gameState.oyaIndex].name}</strong> 以外の全員に +1pt！`);
            gameState.players.forEach((player, idx) => { if (idx !== gameState.oyaIndex) player.score += 1; });
            gameState.phase = 'ROUND_END';
          } else {
            gameState.players.forEach(player => { player.plottedCard = null; player.plottedCardTemp = null; });
            gameState.phase = 'PLOT';
          }
          await updateDoc(getRoomRef(currentRoomId), gameState);
        }, 1500);
      }
    }

    // --- Modal & Next Round ---
    function showModalUI() {
      const scoresBox = document.getElementById('modal-scores');
      scoresBox.innerHTML = '';
      const sorted = [...gameState.players].sort((a,b) => b.score - a.score);
      sorted.forEach((p, rank) => {
        scoresBox.innerHTML += `<div class="flex justify-between items-center py-1 border-b border-slate-200 last:border-0">
          <span>${rank === 0 ? '👑' : `#${rank+1}`} ${p.name}</span>
          <span class="text-indigo-600 font-extrabold">${p.score} pt</span>
        </div>`;
      });
      
      const nextBtn = document.getElementById('modal-next-btn');
      const waitMsg = document.getElementById('modal-waiting-msg');
      if (gameState.hostId === currentUser.uid) {
        nextBtn.classList.remove('hidden'); waitMsg.classList.add('hidden');
        nextBtn.innerText = gameState.round >= 4 ? '最終結果を見る' : `第 ${gameState.round + 1} ラウンドへ`;
      } else {
        nextBtn.classList.add('hidden'); waitMsg.classList.remove('hidden');
      }
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    document.getElementById('modal-next-btn').addEventListener('click', async () => {
      if (gameState.hostId !== currentUser.uid) return;
      if (gameState.round >= 4) {
        await updateDoc(getRoomRef(currentRoomId), { status: 'FINISHED' });
        alert('ゲーム終了！ロビーに戻ります。'); location.reload();
      } else {
        gameState.round++;
        gameState.oyaIndex = (gameState.oyaIndex + 1) % 4;
        setupRoundState();
        await updateDoc(getRoomRef(currentRoomId), gameState);
      }
    });

  </script>
</body>
</html>
